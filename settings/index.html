<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkTap Settings</title>
    <link rel="stylesheet" type="text/css" href="lwsa.css">
    <link rel="stylesheet" type="text/css" href="busy_indicator.css" />
    <style>
        .fog_div {
            display: none;
            position: fixed;
            top: 0px;
            left: 0px;
            height: 100%;
            width: 100%;
            z-index: 100;
            background-color: rgba(30, 30, 30, 0.5);
        }

        #busybox.show {
            display: block;
        }

        .is-hidden {
            display: none;
        }

        .sim-activate {
            background-color: #0f9e16;
            color: white;
            margin: 5px 20px 5px 5px;
        }

        .sim-clear {
            background-color: #a5510d;
            color: white;
            margin: 5px 20px 5px 5px;
        }

        #detectedDevices,
        #diagLog,
        #simData {
            white-space: nowrap;
        }

        .settings-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .settings-note {
            margin-top: 0;
        }

        .homey-form-select {
            min-width: 220px;
        }
    </style>

    <!-- The '/homey.js' script must be included in your settings view to work -->
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <script type="text/javascript" src="busy_indicator.js"></script>
</head>

<body>
    <!-- Busy indicator -->
    <div id="busybox" class="fog_div">
        <div></div>
    </div>

    <!-- Tab links -->
    <div class="tab">
        <button class="tablinks" onclick="setPage(event, 'detected')" id="defaultOpen" title="Detected devices"><span data-i18n="settings.detected"></span></button>
        <button class="tablinks" onclick="setPage(event, 'log')" title="Diagnostics log"><span data-i18n="settings.diagnosticsLog"></span></button>
        <button class="tablinks is-hidden" onclick="setPage(event, 'simulator')" id="simLogTab" title="Simulation Data">Simulation Data</button>
    </div>

    <!-- detected-->
    <div id="detected" class="tabcontent">
        <fieldset class="homey-form-fieldset">
            <p class="settings-actions"><button id="sendDetectedLog" class="homey-button-small" title="Send detected devices"><span data-i18n="settings.sendLog"></span></button></p>
            <p class="settings-note" data-i18n="settings.detectedDescription">
            </p>
            <div class="field row">
                <label class="homey-form-label" for="detectedDevices">Detected devices</label>
                <textarea id="detectedDevices" class="homey-form-textarea" wrap="off" aria-label="Detected devices" title="Detected devices"></textarea>
            </div>
        </fieldset>
    </div>

    <!-- LOG PAGE -->
    <div id="log" class="tabcontent">
        <fieldset class="homey-form-fieldset">
            <p class="settings-note" data-i18n="settings.diagnosticsLog"></p>
            <label class="homey-form-checkbox">
                <input class="homey-form-checkbox-input" id="logEnabled" type="checkbox" value="logEnabled" aria-label="Enable diagnostics logging" title="Enable diagnostics logging" />
                <span class="homey-form-checkbox-checkmark"></span>
                <span class="homey-form-checkbox-text"><span data-i18n="settings.logEnabled"></span></span>
            </label>
            <div class="field row">
                <label class="homey-form-label" for="logFilter"><span data-i18n="settings.logFilterLabel"></span></label>
                <select id="logFilter" class="homey-form-select" aria-label="Diagnostics log filter" title="Diagnostics log filter">
                    <option value="all" data-i18n="settings.logFilterAll">All log entries</option>
                    <option value="webhook" data-i18n="settings.logFilterWebhook">Webhook entries only</option>
                </select>
            </div>
            <p class="settings-actions"><button id="clearDiagLog" class="homey-button-small" title="Clear diagnostics log"><span data-i18n="settings.clearLog"></span></button> <button id="sendDiagLog" class="homey-button-small" title="Send diagnostics log"><span data-i18n="settings.sendLog"></span></button></p>
            <div class="field row">
                <label class="homey-form-label" for="diagLog">Diagnostics log</label>
                <textarea id="diagLog" class="homey-form-textarea" wrap="off" aria-label="Diagnostics log" title="Diagnostics log"></textarea>
            </div>
        </fieldset>
    </div>

    <!--SIMULATION PAGE -->
    <div id="simulator" class="tabcontent">
        <fieldset class="homey-form-fieldset">
            <h1>For debug use only</h1>
            <p class="settings-actions"><button id="useSim" class="sim-activate" title="Activate simulator">Activate</button><button id="clearSim" class="sim-clear" title="Clear simulator">Clear Sim</button></p>
            <div class="field row">
                <label class="homey-form-label" for="simData">Simulator data</label>
                <textarea id="simData" class="homey-form-textarea" wrap="off" aria-label="Simulator data" title="Simulator data"></textarea>
            </div>
        </fieldset>
    </div>

    <script type="text/javascript">
        // Create the busy indicator
        var busyi = new busy_indicator(document.getElementById("busybox"), document.querySelector("#busybox div"));

        var detectedDevicesElement = document.getElementById('detectedDevices');
        var diagLogElement = document.getElementById('diagLog');
        var logEnabledElement = document.getElementById('logEnabled');
        var logFilterElement = document.getElementById('logFilter');

        var clearLogElement = document.getElementById('clearDiagLog');
        var sendDiagLogElement = document.getElementById('sendDiagLog');
        var sendDetectedElement = document.getElementById('sendDetectedLog');

        var rawDiagLog = "";

        // Simulation log tab
        var useSimElement = document.getElementById('useSim');
        var clearSimElement = document.getElementById('clearSim');
        var simDataElement = document.getElementById('simData');

        // a method named 'onHomeyReady' must be present in your code
        function onHomeyReady(Homey)
        {
            Homey.get('debugMode', function(err, debugMode)
            {
                if (err) return Homey.alert(err);
                if (debugMode)
                {
                    document.getElementById("simLogTab").classList.remove('is-hidden');
                }
            });

            document.getElementById("defaultOpen").click();

            Homey.on('com.linktap.logupdated', function(data)
            {
                rawDiagLog = data.log ? data.log : "";
                renderDiagLog();
            });

            Homey.on('com.linktap.detectedDevicesUpdated', function(data)
            {
                detectedDevicesElement.value = data.devices;
            });

            Homey.get('logEnabled', function(err, logEnabled)
            {
                if (err) return Homey.alert(err);
                logEnabledElement.checked = logEnabled;
            });

            Homey.get('diagLogFilter', function(err, logFilter)
            {
                if (err) return Homey.alert(err);
                logFilterElement.value = (logFilter === 'webhook') ? 'webhook' : 'all';
                renderDiagLog();
            });

            Homey.api('GET', '/getLog/',
            {
                notify: true
            }, function(err, result)
            {
                if (err)
                {
                    return Homey.alert(err);
                }
                else
                {
                    rawDiagLog = result ? result : "";
                    renderDiagLog();
                }
            });

            Homey.api('GET', '/getDetect/',
            {
                notify: true
            }, function(err, result)
            {
                if (err)
                {
                    return Homey.alert(err);
                }
                else
                {
                    detectedDevicesElement.value = result;
                }
            });

            logEnabledElement.addEventListener('click', function(e)
            {
                Homey.set('logEnabled', logEnabledElement.checked, function(err)
                {
                    if (err) return Homey.alert(err);
                });
            });

            logFilterElement.addEventListener('change', function(e)
            {
                Homey.set('diagLogFilter', logFilterElement.value, function(err)
                {
                    if (err) return Homey.alert(err);
                    renderDiagLog();
                });
            });

            clearLogElement.addEventListener('click', function(e)
            {
                Homey.api('POST', '/clearLog/',
                {
                    notify: true
                }, function(err, result)
                {
                    if (err)
                    {
                        return Homey.alert(err);
                    }
                    else
                    {
                        rawDiagLog = "";
                        renderDiagLog();
                    }
                });
            });

            sendDiagLogElement.addEventListener('click', function(e)
            {
                Homey.confirm(Homey.__('settings.confirmSend'), null, function(e, ok)
                {
                    if (ok)
                    {
                        waitCursor(true);
                        Homey.api('POST', '/sendLog/',
                        {
                            notify: true,
                            logType: "diag"
                        }, function(err, result)
                        {
                            waitCursor(false);
                            if (err)
                            {
                                return Homey.alert(err);
                            }
                            else
                            {
                                return Homey.alert(result);
                            }
                        });
                    }
                });
            });

            sendDetectedElement.addEventListener('click', function(e)
            {
                Homey.confirm(Homey.__('settings.confirmSend'), null, function(e, ok)
                {
                    if (ok)
                    {
                        waitCursor(true);
                        Homey.api('POST', '/sendLog/',
                        {
                            notify: true,
                            logType: "detected"
                        }, function(err, result)
                        {
                            waitCursor(false);
                            if (err)
                            {
                                return Homey.alert(err);
                            }
                            else
                            {
                                return Homey.alert(result);
                            }
                        });
                    }
                });
            });

            useSimElement.addEventListener('click', function(e)
            {
                try
                {
                    Homey.set('simData', simDataElement.value, function(err)
                    {
                        if (err)
                        {
                            Homey.alert(err);
                        }
                        else
                        {
                            Homey.alert("Simulator On");
                        }
                    });
                }
                catch (err)
                {
                    return Homey.alert(err.message);
                }
            });

            clearSimElement.addEventListener('click', function(e)
            {
                Homey.set('simData', "", function(err)
                {
                    if (err)
                    {
                        return Homey.alert(err);
                    }
                    else
                    {
                        return Homey.alert("Simulator Off");
                    }
                });
            });

            // Tell Homey we're ready to be displayed
            Homey.ready();
        }

        function setPage(evt, tabPage)
        {
            var i, tabcontent, tablinks;

            // Get all elements with class="tabcontent" and hide them
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++)
            {
                tabcontent[i].style.display = "none";
            }

            // Get all elements with class="tablinks" and remove the class "active"
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++)
            {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }

            // Show the current tab, and add an "active" class to the button that opened the tab
            document.getElementById(tabPage).style.display = "block";
            evt.currentTarget.className += " active";

            if (tabPage == 'log')
            {
                // Refresh the log data
                Homey.get('logEnabled', function(err, logEnabled)
                {
                    if (err) return Homey.alert(err);
                    logEnabledElement.checked = logEnabled;
                });

                // Make the log text area fill the page
                diagLogElement.setAttribute('cols', diagLogElement.parentElement.clientWidth / 8);
                diagLogElement.style.height = (window.innerHeight - diagLogElement.offsetTop - 60) + 'px';
                renderDiagLog();
            }
            else if (tabPage == 'detected')
            {
                // Make the detected devices text area fill the page
                detectedDevicesElement.setAttribute('cols', detectedDevicesElement.parentElement.clientWidth / 8);
                detectedDevicesElement.style.height = (window.innerHeight - detectedDevicesElement.offsetTop - 60) + 'px';
            }
            else if (tabPage == 'simulator')
            {
                Homey.get('simData', function(err, simData)
                {
                    if (err) return Homey.alert(err);
                    simDataElement.value = simData ? simData : "";
                });
                // Make the simulator text box fill the page
                simDataElement.setAttribute('cols', simDataElement.parentElement.clientWidth / 8);
                simDataElement.style.height = (window.innerHeight - simDataElement.offsetTop - 60) + 'px';
            }
        }

        function waitCursor(On)
        {
            if (On)
            {
                busyi.show();
            }
            else
            {
                busyi.hide();
            }
        }

        function renderDiagLog()
        {
            diagLogElement.value = getFilteredDiagLog(rawDiagLog);
        }

        function getFilteredDiagLog(logText)
        {
            if (logFilterElement.value !== 'webhook')
            {
                return logText;
            }

            var entries = splitDiagLogEntries(logText);
            var filtered = entries.filter(function(entry)
            {
                return /web\s*hook/i.test(entry);
            });

            return filtered.join('');
        }

        function splitDiagLogEntries(logText)
        {
            if (!logText)
            {
                return [];
            }

            var source = logText;
            if (source.indexOf('* ') !== 0)
            {
                source = source.replace(/^\s+/, '');
            }

            var parts = source.split(/\r?\n\* /);
            var entries = [];
            for (var i = 0; i < parts.length; i++)
            {
                if (!parts[i])
                {
                    continue;
                }

                var entry = '* ' + parts[i];
                if (!/\r?\n$/.test(entry))
                {
                    entry += '\r\n';
                }
                entries.push(entry);
            }

            return entries;
        }
    </script>

</body>

</html>
